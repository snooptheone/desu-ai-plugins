name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate JSON manifests and eval files
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 \
            | xargs -0 -n1 jq empty

      - name: shunt-agy hook + transport evals
        run: bash plugins/shunt-agy/evals/run.sh

  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Every marketplace entry matches its plugin manifest (name and version)
        run: |
          jq -r '.plugins[] | "\(.name) \(.source) \(.version // "")"' .claude-plugin/marketplace.json |
          while read -r name source version; do
            test "$(jq -r .name "$source/.claude-plugin/plugin.json")" = "$name" \
              || { echo "::error::$source manifest does not match '$name'"; exit 1; }
            test -z "$version" || test "$(jq -r .version "$source/.claude-plugin/plugin.json")" = "$version" \
              || { echo "::error::$name version differs between marketplace.json and plugin.json"; exit 1; }
          done

      # Installed copies only update when the version changes, so a change that
      # ships (anything but evals, tests and the README) must bump it. A SKILL.md ships.
      - name: A changed plugin bumps its version
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          jq -r '.plugins[] | "\(.name) \(.source)"' .claude-plugin/marketplace.json |
          while read -r name source; do
            source=${source#./}
            git diff --quiet "origin/$BASE" -- "$source" ":(exclude)$source/evals" ":(exclude)$source/tests" ":(exclude)$source/README.md" && continue
            old=$(git show "origin/$BASE:$source/.claude-plugin/plugin.json" 2>/dev/null | jq -r .version)
            test -n "$old" || continue # new plugin
            test "$old" != "$(jq -r .version "$source/.claude-plugin/plugin.json")" \
              || { echo "::error::$name changed but its version is still $old"; exit 1; }
          done

  unifi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Tests
        run: node --test plugins/unifi/tests/*.test.js

      - name: Test-VM tooling (fake ssh, no VM)
        if: matrix.node == '22' # shell scripts: the Node version changes nothing here
        run: bash plugins/unifi/tests/e2e/selftest.sh
